<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CineTrack</h1>
        <form role="search">
            <input type="search" placeholder="Buscar filme" aria-label="Buscar filme">
            <button type="button" class="btn-adicionar" id="btn-abrir-modal">
                <span class="btn-icone">+</span>
                <span class="btn-texto">+ Adicionar</span>
            </button>
        </form>
    </header>

    <nav aria-label="Filtros de status">
        <button type="button" class="ativo">Todos</button>
        <button type="button">Assistido</button>
        <button type="button">Assistindo</button>
        <button type="button">Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite">
        </section>
    </main>

    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h2>Adicionar filme</h2>
            <form id="form-filme">
                <div>
                    <label for="titulo">Título</label><br>
                    <input id="titulo" name="titulo" type="text" required>
                </div>

                <div>
                    <label for="ano">Ano</label><br>
                    <input id="ano" name="ano" type="number" min="1888" max="2026" step="1" required>
                </div>

                <div> 
                    <label for="genero">Gênero</label><br>
                    <input id="genero" name="genero" type="text" required>
                </div>

                <div>
                    <label for="poster">URL do pôster</label><br>
                    <input id="poster" name="poster" type="text">
                </div>

                <div>
                    <label for="status">Status</label><br>
                    <select id="status" name="status" required>
                        <option value="assistido">Assistido</option>
                        <option value="assistindo">Assistindo</option>
                        <option value="quero" selected>Quero assistir</option>
                    </select>
                </div>

                <div>
                    <label for="nota">Nota (1 a 5)</label><br>
                    <input id="nota" name="nota" type="number" min="1" max="5" class="input-small">
                </div>

                <div>
                    <label for="comentario">Comentário</label><br>
                    <textarea id="comentario" name="comentario"></textarea>
                </div>

                <button type="button">Cancelar</button>
                <button type="submit">Salvar</button>
            </form>
        </div>
    </div>

    <footer>
        <p><button type="button" class="link-adicionar" id="link-abrir-modal">Adicionar novo filme</button></p>
        <p><a href="sobre.html">Sobre o projeto</a></p>
        <small>CineTrack © 2026 · 6 filmes cadastrados</small>
    </footer>

    <script src="app.js"></script>

</body>
</html>
