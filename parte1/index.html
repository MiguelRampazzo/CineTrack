<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CineTrack</h1>
        <form role="search">
            <input type="search" placeholder="Buscar filme" aria-label="Buscar filme">
        </form>
        <button type="button" class="btn-adicionar" id="btn-abrir-modal">
            <span class="btn-texto">+ Adicionar</span>
        </button>
    </header>

    <nav aria-label="Filtros de status">
        <button type="button" class="ativo" data-status="todos">Todos (0)</button>
        <button type="button" data-status="assistido">Assistido (0)</button>
        <button type="button" data-status="assistindo">Assistindo (0)</button>
        <button type="button" data-status="quero">Quero assistir (0)</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite"></section>
    </main>

    <div id="modal" hidden>
        <div class="modal-conteudo">
            <form id="form-filme">
                <h2>Adicionar filme</h2>


                <div id="msg-erro" class="mensagem-erro" hidden aria-live="assertive"></div>
                
                <div class="campo">
                    <label for="titulo">Título</label>
                    <input id="titulo" name="titulo" type="text" required>
                </div>

                <div class="campo">
                    <label for="ano">Ano</label>
                    <input id="ano" name="ano" type="number" min="1888" max="2030" required>
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <input id="genero" name="genero" type="text" required>
                </div>

                <div class="campo">
                    <label for="poster">URL do pôster</label>
                    <input id="poster" name="poster" type="text">
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="assistido">Assistido</option>
                        <option value="assistindo">Assistindo</option>
                        <option value="quero" selected>Quero assistir</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nota">Nota (1 a 5)</label>
                    <input id="nota" name="nota" type="number" min="1" max="5">
                </div>

                <div class="campo">
                    <label for="comentario">Comentário</label>
                    <textarea id="comentario" name="comentario"></textarea>
                </div>

                <div class="botoes">
                    <button type="button" id="btn-cancelar">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>


    <footer>
        <p><button type="button" class="link-adicionar" id="link-abrir-modal">Adicionar novo filme</button></p>
        <p><a href="sobre.html">Sobre o projeto</a></p>
        <small>CineTrack © 2026 · 6 filmes cadastrados</small>
    </footer>

    <script src="app.js"></script>

</body>
</html>
