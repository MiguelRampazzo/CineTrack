<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Filme - CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-pagina">
        <div>
            <a href="index.html" class="back-link">&larr; Voltar</a>
        </div>

        <h1>Adicionar filme</h1>

        <form id="form-filme">
            <div class="campo">
                <label for="titulo">Título</label>
                <input id="titulo" name="titulo" type="text" required>
            </div>

            <div class="campo">
                <label for="ano">Ano</label>
                <input id="ano" name="ano" type="number" min="1888" max="2026" step="1" required>
            </div>

            <div class="campo"> 
                <label for="genero">Gênero</label>
                <input id="genero" name="genero" type="text" required>
            </div>

            <div class="campo">
                <label for="poster">URL do pôster</label>
                <input id="poster" name="poster" type="text">
            </div>

            <div class="campo">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="assistido">Assistido</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="quero" selected>Quero assistir</option>
                </select>
            </div>

            <div class="campo">
                <label for="nota">Nota (1 a 5)</label>
                <input id="nota" name="nota" type="number" min="1" max="5">
            </div>

            <div class="campo">
                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario"></textarea>
            </div>

            <div class="botoes">
                <button type="button" onclick="location.href='index.html'">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>
        </form>
    </div>

</body>
</html>
